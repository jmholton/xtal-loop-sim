<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loop-sim camera</title>
<style>
  :root { --bg:#15171c; --panel:#1e2128; --ink:#e6e8ec; --accent:#5bb0ff; --line:#3a3f4b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .wrap { display:flex; flex-wrap:wrap; gap:18px; padding:18px; align-items:flex-start; }
  h1 { font-size:14px; font-weight:600; letter-spacing:.04em; opacity:.75; margin:0 0 10px; }

  /* live view + crosshair */
  /* inline-block so the box shrink-wraps the <img> exactly — the crosshair
     (50%) and click layer (inset:0) then coincide with the real image. */
  .view { position:relative; display:inline-block; line-height:0; background:#000;
          border:1px solid var(--line); border-radius:6px; overflow:hidden; cursor:crosshair; }
  #cam { display:block; max-width:80vw; height:auto; }
  .cross { position:absolute; inset:0; pointer-events:none; }
  .cross::before, .cross::after { content:""; position:absolute; background:rgba(120,200,255,.7); }
  .cross::before { left:50%; top:0; bottom:0; width:1px; transform:translateX(-.5px); }
  .cross::after  { top:50%; left:0; right:0; height:1px; transform:translateY(-.5px); }
  .cross .dot { position:absolute; left:50%; top:50%; width:9px; height:9px; margin:-5px 0 0 -5px;
                border:1px solid rgba(120,200,255,.9); border-radius:50%; }
  /* transparent top layer that reliably captures clicks over the stream */
  .clicklayer { position:absolute; inset:0; cursor:crosshair; }
  .clickmark { position:absolute; width:16px; height:16px; margin:-8px 0 0 -8px;
               border:2px solid var(--accent); border-radius:50%; pointer-events:none; opacity:0; }
  .clickmark.flash { animation: clickpulse .5s ease-out; }
  @keyframes clickpulse { from {opacity:1; transform:scale(.4)} to {opacity:0; transform:scale(1.7)} }

  /* controls */
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px;
           padding:14px 16px; min-width:230px; }
  .panel h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em;
              opacity:.55; margin:0 0 10px; font-weight:600; }
  .grp { margin-bottom:16px; }
  button { background:#2a2e38; color:var(--ink); border:1px solid var(--line);
           border-radius:6px; padding:8px 10px; font:inherit; cursor:pointer; min-width:38px; }
  button:hover { border-color:var(--accent); }
  button:active { background:#333a47; }
  .pad { display:grid; grid-template-columns:repeat(3,40px); grid-template-rows:repeat(3,38px);
         gap:6px; justify-content:start; }
  .pad .sp { visibility:hidden; }
  .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .row label { width:48px; opacity:.7; font-size:12px; }
  input[type=number] { width:84px; background:#11131a; color:var(--ink);
           border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  input[type=range] { width:150px; accent-color:var(--accent); }
  .val { font-variant-numeric: tabular-nums; opacity:.85; }
  .hint { font-size:11px; opacity:.5; margin-top:10px; line-height:1.5; }
  #state { font-size:11px; opacity:.7; white-space:pre; margin-top:8px; }

  /* scene tabs */
  .tabs { display:flex; gap:6px; margin:0 0 8px; flex-wrap:wrap; }
  .tab { border-radius:6px 6px 0 0; padding:6px 12px; opacity:.7; }
  .tab[aria-selected="true"] { border-color:var(--accent); background:#333a47; opacity:1; }
  .tab[disabled] { opacity:.4; cursor:default; }
  .tab .badge { font-size:10px; margin-left:6px; opacity:.85; }
  .tab.stale .badge, .tab.preview .badge { color:#e8c46a; }
  .tab.missing .badge { color:#e88a6a; }
  .ask { border:1px solid var(--accent); border-radius:6px; padding:10px 12px;
         margin:0 0 8px; font-size:12px; line-height:1.7; max-width:620px; }
  .ask button { padding:4px 8px; min-width:0; font-size:11px; }
  /* A SECOND status line, owned solely by the scene code.  poll() rewrites
     #state wholesale every 600 ms from /motor, so anything long-lived -- a
     stale-library warning, build progress, a failed switch -- has to live
     outside it or it flickers once and is gone. */
  #notice { font-size:11px; white-space:pre-wrap; line-height:1.5; margin-top:8px; }
  #notice:empty { display:none; }
  #notice.warn { color:#e8c46a; }
  #notice.err  { color:#ff8a7a; }
  #notice.busy { color:var(--accent); }

  /* Microscope/Radiograph toggle -- reuses .tabs/.tab/.badge above verbatim;
     #modenotice is its own element for the same reason #notice is its own
     element (see the comment by #notice below): nothing here may be rewritten
     out from under it by another owner. */
  #modenotice { font-size:11px; white-space:pre-wrap; line-height:1.5; margin:0 0 8px; }
  #modenotice:empty { display:none; }
  #modenotice.warn { color:#e8c46a; }
  #modenotice.err  { color:#ff8a7a; }
  #modenotice.busy { color:var(--accent); }

  /* /beam readout: a <details> so it costs nothing while closed -- see
     refreshBeam(), only ever called while it is open. */
  #beamdetails { margin-top:16px; border-top:1px solid var(--line); padding-top:12px; }
  #beamdetails summary { cursor:pointer; font-size:11px; text-transform:uppercase;
                          letter-spacing:.08em; opacity:.55; font-weight:600; }
  #beamdetails summary:hover { opacity:.8; }
  #beamOut { font-size:11px; white-space:pre; line-height:1.6; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>LOOP-SIM &nbsp;·&nbsp; live view</h1>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="ask" id="ask" hidden></div>
    <div class="tabs" id="modetabs" role="tablist"></div>
    <div id="modenotice"></div>
    <div class="view" id="view">
      <img id="cam" src="/axis-cgi/mjpg/video.cgi" alt="camera">
      <div class="cross"><div class="dot"></div></div>
      <div class="clickmark" id="clickmark"></div>
      <div class="clicklayer" id="clicklayer"></div>
    </div>
    <div class="hint">Click anywhere in the image to bring that point to the centre.</div>
  </div>

  <div class="panel">
    <h2>Translate</h2>
    <div class="grp pad">
      <div class="sp"></div><button data-pan="0,-1" title="up">&#9650;</button><div class="sp"></div>
      <button data-pan="-1,0" title="left">&#9664;</button>
      <button id="recenter" title="recenter to origin">&#9678;</button>
      <button data-pan="1,0" title="right">&#9654;</button>
      <div class="sp"></div><button data-pan="0,1" title="down">&#9660;</button><div class="sp"></div>
    </div>

    <h2>Jog</h2>
    <div class="grp">
      <div class="row">
        <label>&phi;</label>
        <button data-drotx="-1" id="phiminus"></button>
        <input id="phijog" type="number" step="1"
               title="current spindle angle -- type one and press Enter">&deg;
        <button data-drotx="1" id="phiplus"></button>
      </div>
      <div class="row">
        <label>zoom</label>
        <button data-dzoom="-1">&minus;</button>
        <input id="zoom" type="number" step="0.1" min="0.1" value="1.0">&times;
        <button data-dzoom="1">+</button>
      </div>
    </div>

    <h2>Goniometer target</h2>
    <div class="grp">
      <div class="row"><label>X</label><input id="tgt_tx" type="number" step="0.01" value="0"> mm</div>
      <div class="row"><label>Y</label><input id="tgt_ty" type="number" step="0.01" value="0"> mm</div>
      <div class="row"><label>Z</label><input id="tgt_tz" type="number" step="0.01" value="0"> mm</div>
      <div class="row"><label>&phi;</label><input id="tgt_rotx" type="number" step="1" value="0"> &deg;</div>
      <div class="row">
        <button id="go" style="min-width:64px">GO</button>
        <button id="usecur" title="load the current position into the target boxes">&#8635;</button>
      </div>
    </div>

    <h2>Speed</h2>
    <div class="grp">
      <div class="row">
        <input id="speed" type="range" min="-1.3" max="0.7" step="0.01" value="0">
        <span class="val" id="speedval">1.0&times;</span>
      </div>
      <div class="hint">slow-motion &nbsp;&larr;&nbsp; 1&times; &nbsp;&rarr;&nbsp; fast</div>
    </div>

    <div id="state"></div>
    <div id="notice"></div>
    <div id="dbg" class="hint" style="white-space:pre"></div>

    <details id="beamdetails">
      <summary>X-ray beam &middot; dose &amp; volumes</summary>
      <div id="beamOut">expand to fetch dose &amp; volume at the current pose</div>
    </details>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const cam = $("cam"), layer = $("clicklayer"), mark = $("clickmark");

// step sizes
const PAN_FRAC = 0.25;   // quarter of the field of view per arrow click
const ROT_STEP = 15;     // degrees per rotx click
const ZOOM_FAC = 1.25;   // zoom multiply/divide per click
// Buttons say what they DO; the box between them says where phi IS, and is
// also how you type one.  Same commit convention as the zoom box: Enter or
// blur sends an absolute animated move.
$("phiminus").textContent = "−" + ROT_STEP + "°";
$("phiplus").textContent  = "+" + ROT_STEP + "°";
(function bindPhi() {
  const el = $("phijog");
  const commit = () => {
    const v = parseFloat(el.value);
    if (!Number.isFinite(v)) return;   // never slew to 0 on an unparseable box
    move({ rotx: v });
  };
  el.addEventListener("keydown", e => { if (e.key === "Enter") { commit(); el.blur(); } });
  el.addEventListener("change", commit);
})();

// speed dial: slider is log10(speed), so 0 → 1x, -1 → 0.1x (slow-mo), +0.7 → ~5x
function speed() { return Math.pow(10, parseFloat($("speed").value)); }
function fmtSpeed() { const s = speed(); $("speedval").textContent =
    (s >= 1 ? s.toFixed(1) : s.toFixed(2)) + "×"; }
$("speed").addEventListener("input", fmtSpeed);

// fire an animated move; the server replies with the (target) motor state
async function move(params) {
  params.speed = speed();
  const q = new URLSearchParams(params).toString();
  try {
    const s = await (await fetch("/move?" + q)).json();
    applyState(s);
    return s;
  } catch (e) { return null; }
}

// translate pad
document.querySelectorAll("[data-pan]").forEach(b => b.addEventListener("click", () => {
  const [fx, fy] = b.dataset.pan.split(",").map(Number);
  move({ panx: fx * PAN_FRAC, pany: fy * PAN_FRAC });
}));
// rotx -/+
document.querySelectorAll("[data-drotx]").forEach(b => b.addEventListener("click", () =>
  move({ drotx: Number(b.dataset.drotx) * ROT_STEP })));
// zoom -/+ (multiplicative, sent as an absolute target)
document.querySelectorAll("[data-dzoom]").forEach(b => b.addEventListener("click", () => {
  const cur = parseFloat($("zoom").value) || 1.0;
  const dir = Number(b.dataset.dzoom);
  move({ zoom: dir > 0 ? cur * ZOOM_FAC : cur / ZOOM_FAC });
}));

// zoom box → absolute animated move on Enter or blur
(function bindZoom() {
  const el = $("zoom");
  const commit = () => move({ zoom: parseFloat(el.value) || 1.0 });
  el.addEventListener("keydown", e => { if (e.key === "Enter") { commit(); el.blur(); } });
  el.addEventListener("change", commit);
})();

// Goniometer target: type X/Y/Z/phi, press GO, the stage slews there.
// One /move carries all four axes so they arrive together and the animator
// interpolates the whole pose as a single motion.
//
// The boxes FOLLOW the stage, so however you got somewhere -- click-to-centre,
// the translate pad, a jog -- they hold that pose and a relative edit starts
// from where you actually are, not from the last thing typed.
//
// The exception is a box you are composing.  Auto-updating every box on every
// poll would clobber a multi-axis target as soon as you tab out of the first
// field, so an edited box is left alone until GO consumes it.
const TGT = { tx: "tgt_tx", ty: "tgt_ty", tz: "tgt_tz", rotx: "tgt_rotx" };
const tgtEdited = new Set();     // boxes typed in since the last GO
for (const [key, id] of Object.entries(TGT)) {
  // `input` fires on operator typing only -- setting .value from JS does not.
  $(id).addEventListener("input", () => tgtEdited.add(key));
}
async function go() {
  const p = {};
  for (const [key, id] of Object.entries(TGT)) {
    const v = parseFloat($(id).value);
    if (!Number.isFinite(v)) {
      // Defaulting an unparseable box to 0 would silently slew that axis to
      // the origin -- e.g. a decimal comma yields "" in a number input.
      $(id).focus();
      $("state").textContent = `cannot move: ${key.toUpperCase()} is not a number`;
      return;
    }
    p[key] = v;
  }
  const s = await move(p);
  tgtEdited.clear();             // target consumed -- boxes follow the stage again
  // The server clamps a target the frame library cannot show.  Leaving the
  // typed number in the box while the stage sits at the cap is the mismatch
  // this corrects: the box is rewritten to the value that matches the picture.
  if (s) writeBackClamped(p, s);
}

// Rewrite any target box the server had to clamp, and name the axes it moved.
function writeBackClamped(asked, got) {
  const capped = [];
  for (const [key, id] of Object.entries(TGT)) {
    if (!(key in asked)) continue;
    const dp = key === "rotx" ? 1 : 3;
    // Compare at the precision the box displays, so a 1e-16 inversion
    // residual never counts as a clamp.
    if ((+got[key]).toFixed(dp) !== (+asked[key]).toFixed(dp)) {
      $(id).value = (+got[key]).toFixed(dp);
      capped.push(key.toUpperCase().replace("ROTX", "PHI"));
    }
  }
  if (capped.length) {
    $("state").textContent =
      `${capped.join(", ")} clamped to what the frame library can show\n` +
      $("state").textContent;
  }
}
function loadCurrent(s, force) {
  if (!s) return;
  for (const [key, id] of Object.entries(TGT)) {
    if (!force && (document.activeElement === $(id) || tgtEdited.has(key))) continue;
    $(id).value = (+s[key]).toFixed(key === "rotx" ? 1 : 3);
  }
}
$("go").addEventListener("click", go);
// The load-current button is an explicit "discard what I typed, show me where
// the stage is", so it overrides both guards.
$("usecur").addEventListener("click", async () => {
  try {
    tgtEdited.clear();
    loadCurrent(await (await fetch("/motor")).json(), true);
  } catch (e) {}
});
for (const id of Object.values(TGT)) {
  $(id).addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); go(); $(id).blur(); }
  });
}

// recenter button → animate back to the stage origin.
// tz MUST be zeroed too: the translate pad is image-relative, so at any
// phi != 0 a screen-space pan lands partly in tz (at phi = 90 it is entirely
// tz).  Zeroing only tx/ty left that depth offset in place, so the button did
// nothing at phi = 90 and undershot everywhere between.
$("recenter").addEventListener("click", () => move({ tx: 0, ty: 0, tz: 0 }));

// click in the image → move that pixel to the centre.
// The click is taken as a FRACTION of the displayed image (the server scales it
// by the true camera resolution — no dependence on the unreliable MJPEG
// naturalWidth or the CSS-displayed size).  A dedicated transparent top layer
// captures the click reliably, and a ring flashes where you clicked.
layer.addEventListener("click", async e => {
  const r  = cam.getBoundingClientRect();      // the real image rect (authoritative)
  const lx = e.clientX - r.left, ly = e.clientY - r.top;
  const fx = lx / r.width, fy = ly / r.height;
  if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return;     // outside the image
  // visual confirmation at the click point
  mark.style.left = lx + "px"; mark.style.top = ly + "px";
  mark.classList.remove("flash"); void mark.offsetWidth; mark.classList.add("flash");
  showSizes(`click @ img-frac (${fx.toFixed(3)}, ${fy.toFixed(3)})  px(${lx.toFixed(0)},${ly.toFixed(0)}) of ${r.width.toFixed(0)}×${r.height.toFixed(0)}`);
  const q = new URLSearchParams({ fx: fx.toFixed(4), fy: fy.toFixed(4), speed: speed() });
  try { applyState(await (await fetch("/recenter?" + q)).json()); } catch (e) {}
});

// debug: is the view box exactly the image box?  (crosshair + clicks assume so)
function showSizes(extra) {
  const v = $("view").getBoundingClientRect(), c = cam.getBoundingClientRect();
  const mismatch = Math.abs(v.width - c.width) > 1 || Math.abs(v.height - c.height) > 1;
  $("dbg").textContent =
    `view ${v.width.toFixed(0)}×${v.height.toFixed(0)}   img ${c.width.toFixed(0)}×${c.height.toFixed(0)}   `
    + (mismatch ? "⚠ view≠img" : "✓ view=img")
    + (extra ? "\n" + extra : "");
}
window.addEventListener("resize", () => showSizes());
cam.addEventListener("load", () => showSizes());
showSizes();

// keep the boxes / readout in sync with the server (skip a box being edited)
function applyState(s) {
  if (!s) return;
  if (document.activeElement !== $("zoom")) $("zoom").value = (+s.zoom).toFixed(2);
  if (document.activeElement !== $("phijog")) $("phijog").value = (+s.rotx).toFixed(1);
  loadCurrent(s);                // target boxes track the stage (see TGT above)
  $("state").textContent =
    `X ${(+s.tx).toFixed(3)}  Y ${(+s.ty).toFixed(3)}  Z ${(+s.tz).toFixed(3)}  (mm)\n` +
    `phi ${(+s.rotx).toFixed(1)}°   zoom ${(+s.zoom).toFixed(2)}×`;

  // Pose-settle: two consecutive identical readings, from any source (a poll,
  // an animated move's own reply, a recentre) -- see the Microscope/Radiograph
  // section below for why this is the trigger rather than every 600 ms tick.
  const sig = poseSig(s);
  if (sig === lastPoseSig) {
    if (MODE === "radiograph" && sig !== lastXraySig) { lastXraySig = sig; refreshXray(); }
    if (beamdetails.open && sig !== lastBeamSig) { lastBeamSig = sig; refreshBeam(); }
  }
  lastPoseSig = sig;
}
async function poll() {
  try { applyState(await (await fetch("/motor")).json()); } catch (e) {}
}
fmtSpeed();
// Seed everything from the live pose; applyState keeps it there from then on.
(async () => {
  try { applyState(await (await fetch("/motor")).json()); } catch (e) {}
})();
setInterval(poll, 600);

// ---------------------------------------------------------------------------
// Scenes: tab strip, build dialogue, switch banner.
//
// Everything here writes to #notice, never #state: poll() above rewrites
// #state from /motor every 600 ms, so a build banner or a stale-library
// warning parked there would survive less than a second.  Two elements, two
// owners -- #state is the live pose, #notice is everything that must persist.
// ---------------------------------------------------------------------------
let SCENES = [], CAN_BUILD = true, BUILD_REFUSAL = "";
let SWITCHING = false, switchTimer = null;

function notice(text, kind) {
  $("notice").textContent = text || "";
  $("notice").className   = text ? (kind || "") : "";
}

function renderTabs() {
  $("tabs").innerHTML = SCENES.map(s => {
    const st = s.serving_from === "preview" ? "preview"
             : (s.can_serve ? (s.library.status === "stale" ? "stale" : "ok")
                            : "missing");
    const label = { ok: "", stale: "stale", preview: "preview", missing: "no library" }[st];
    const tip = (s.warning || (st === "missing" ? "no frame library yet" : ""))
                  .replace(/"/g, "&quot;");
    return `<button class="tab ${st}" role="tab" data-scene="${s.path}"`
         + ` data-serve="${s.can_serve}" aria-selected="${s.is_current_scene}"`
         + `${SWITCHING ? " disabled" : ""} title="${tip}">${s.name}`
         + (label ? `<span class="badge">${label}</span>` : "") + `</button>`;
  }).join("");
}

// ONE delegated listener, bound once.  The tabs are re-rendered wholesale on
// every /scenes refresh, so per-button listeners would have to be re-bound
// each time -- the same reason the translate pad uses [data-pan].
$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab");
  if (!b || SWITCHING || b.getAttribute("aria-selected") === "true") return;
  $("ask").hidden = true;
  const s = SCENES.find(x => x.path === b.dataset.scene);
  if (!s) return;
  if (s.can_serve) switchTo(s.path, null);   // stale IS servable: no dialogue
  else askBuild(s);
});

// The build dialogue: an inline strip, not a modal.  This page has no dialog
// or overlay pattern and one scene switch does not justify inventing one.
function askBuild(s) {
  const el = $("ask");
  el.innerHTML =
    `<b>${s.name}</b> has no frame library yet. Building one renders a 360&deg; `
  + `sweep once; every frame after that is replayed with no GPU.`
  + `<div style="margin-top:8px">`
  +   `<button data-build="preview">build preview &mdash; 72 frames, coarse</button> `
  +   `<button data-build="full">build full &mdash; 360 frames, up to ~1 h</button> `
  +   `<button data-build="">cancel</button>`
  + `</div>`
  + (CAN_BUILD ? "" : `<div style="margin-top:8px;opacity:.75">${BUILD_REFUSAL}</div>`);
  el.hidden = false;
  el.querySelectorAll("button").forEach(b => {
    if (b.dataset.build && !CAN_BUILD) b.disabled = true;
    b.addEventListener("click", () => {
      el.hidden = true;
      if (b.dataset.build) switchTo(s.path, b.dataset.build);
    });
  });
  const first = el.querySelector('button[data-build="preview"]');
  if (first && !first.disabled) first.focus();      // preview is the default
}

async function switchTo(path, build) {
  SWITCHING = true; renderTabs();
  notice(build ? `starting ${build} build…` : "switching…", "busy");
  let r, j;
  try {
    const q = new URLSearchParams({ path });
    if (build) q.set("build", build);
    r = await fetch("/scene?" + q, { method: "POST" });
    j = await r.json();
  } catch (e) {
    SWITCHING = false; renderTabs(); notice("switch request failed", "err");
    return;
  }
  if (r.status !== 202) {
    SWITCHING = false; renderTabs();
    // needs_build means the scene is fine, it just has no library: offer the
    // choice rather than reporting it as an error.
    if (j.needs_build) { const s = SCENES.find(x => x.path === path); if (s) askBuild(s); }
    else notice(j.error || `switch refused (${r.status})`, "err");
    return;
  }
  pollSwitch();
}

// Self-terminating poller: it re-arms only while a switch is actually running,
// so an idle viewer makes one /scene call at load and none after.
function pollSwitch() {
  if (switchTimer) return;
  switchTimer = setInterval(async () => {
    let j;
    try { j = await (await fetch("/scene")).json(); } catch (e) { return; }
    const sw = j.switch;
    if (["validating", "building", "installing"].includes(sw.status)) {
      SWITCHING = true;
      const pct = sw.percent === null ? "" : `  ${sw.percent.toFixed(0)}%`;
      notice(`${sw.build ? sw.build + " build" : "switching"} → `
           + `${(sw.scene || "").split("/").pop()}\n${sw.phase}${pct}`
           + (sw.message ? `\n${sw.message}` : ""), "busy");
      return;
    }
    clearInterval(switchTimer); switchTimer = null;
    SWITCHING = false;
    if (sw.status === "error") {
      // Nothing changed: a failed switch leaves the old scene installed.
      notice(`switch FAILED: ${sw.error}\nstill serving ${j.name}`, "err");
    } else {
      notice(j.warning, "warn");     // stale-library warning, or cleared
    }
    await refreshScenes();
    poll();                          // re-seed the boxes against the new clamps
    // A switch changes the scene under the Radiograph view -- the stale image
    // from the old one must not linger, and the new scene's own pose-settle
    // won't fire this on its own if it happens to land back on home (0,0,0,0,1x).
    if (sw.status !== "error" && MODE === "radiograph") { lastXraySig = null; refreshXray(); }
  }, 800);
}

async function refreshScenes() {
  try {
    const j = await (await fetch("/scenes")).json();
    SCENES = j.scenes;
    CAN_BUILD = j.can_build; BUILD_REFUSAL = j.build_refusal || "";
  } catch (e) { return; }
  renderTabs();
  renderModeTabs();   // the Radiograph tab's "no library" badge is per-scene
}

// Boot: draw the tabs, and pick up a switch already running (or one that
// failed) if the page was loaded or reloaded mid-flight.
(async () => {
  await refreshScenes();
  try {
    const j = await (await fetch("/scene")).json();
    if (["validating", "building", "installing"].includes(j.switch.status)) pollSwitch();
    else if (j.switch.status === "error") notice(`switch FAILED: ${j.switch.error}`, "err");
    else notice(j.warning, "warn");
  } catch (e) {}
})();

// ---------------------------------------------------------------------------
// Microscope / Radiograph toggle, and the /beam dose-and-volumes panel.
//
// /xray takes no query params -- it always renders the server's LIVE pose
// (the same one the MJPEG stream reflects, and clamped the same way via
// pose_crop(clamp=True) -- see loop_sim/server/camera_server.py), so
// switching modes is just swapping #cam's src; no pose has to be threaded
// through a URL. It stays a still, not a stream: nothing needs 10fps for a
// transmission check, and a second MJPEG-style pipeline would need its own
// single-flight machinery for no reason (docs/DECISIONS.md 2026-08-18).
//
// The image is refreshed on POSE-SETTLE, not on every 600 ms poll -- reusing
// applyState's own signature of the pose (see poseSig below): two consecutive
// readings reporting the identical pose. During an animated move consecutive
// polls differ (the animator is still interpolating), so this fires exactly
// once, right after motion actually stops, from a jog, a pad click, a typed
// target or a recentre alike.
let MODE = "microscope";
let lastPoseSig = null, lastXraySig = null, lastBeamSig = null;

function poseSig(s) {
  return ["tx", "ty", "tz", "rotx", "zoom"].map(k => (+s[k]).toFixed(4)).join(",");
}

function modenotice(text, kind) {
  $("modenotice").textContent = text || "";
  $("modenotice").className   = text ? (kind || "") : "";
}

// Badged the same way a scene tab is (.tab.missing .badge, reused verbatim):
// tells the operator BEFORE they click whether Radiograph will answer in
// single-digit ms or fall through to a live render that can take tens of
// seconds to minutes on a mesh scene with no library (docs/RUNBOOK.md
// "X-ray radiograph library").
function xrayLibMissing() {
  const cur = SCENES.find(s => s.is_current_scene);
  return !cur || cur.xray_library.status === "missing";
}
function renderModeTabs() {
  const noLib = xrayLibMissing();
  $("modetabs").innerHTML =
      `<button class="tab" role="tab" data-mode="microscope"`
    + ` aria-selected="${MODE === "microscope"}">Microscope</button>`
    + `<button class="tab${noLib ? " missing" : ""}" role="tab" data-mode="radiograph"`
    + ` aria-selected="${MODE === "radiograph"}">Radiograph`
    + (noLib ? `<span class="badge">no library, slow</span>` : "") + `</button>`;
}
// Same delegated-listener idiom as #tabs: rendered wholesale, bound once.
$("modetabs").addEventListener("click", e => {
  const b = e.target.closest(".tab");
  if (!b) return;
  setMode(b.dataset.mode);
});

function setMode(mode) {
  if (mode === MODE) return;
  MODE = mode;
  renderModeTabs();
  if (mode === "microscope") {
    modenotice("");
    cam.src = "/axis-cgi/mjpg/video.cgi";
  } else {
    lastXraySig = null;   // force an immediate render at the current pose
    refreshXray();
  }
}

function refreshXray() {
  modenotice("rendering radiograph…" +
    (xrayLibMissing() ? " (no library for this scene — can take tens of seconds)" : ""),
    "busy");
  cam.src = "/xray?t=" + Date.now();
}
cam.addEventListener("load",  () => { if (MODE === "radiograph") modenotice(""); });
cam.addEventListener("error", () => { if (MODE === "radiograph") modenotice("radiograph request failed", "err"); });

// /beam: fetched only while the <details> is open, and re-fetched on the same
// pose-settle signal as the radiograph -- never on #state's 600 ms rewrite and
// never sharing #notice, which the scene-switch code above owns exclusively.
const beamdetails = $("beamdetails");
function formatBeam(j) {
  const lines = [`beam transmission  ${(100 * j.beam_transmission).toFixed(1)}%`, ""];
  for (const [name, e] of Object.entries(j)) {
    if (name === "beam_transmission") continue;
    lines.push(`${name.padEnd(10)} vol ${e.volume_mm3.toExponential(2)} mm³` +
               `  absorbed ${(100 * e.absorbed_dose).toFixed(1)}%` +
               `  transmitted ${(100 * e.transmitted_frac).toFixed(1)}%`);
  }
  return lines.join("\n");
}
async function refreshBeam() {
  $("beamOut").textContent = "loading…";
  try {
    const j = await (await fetch("/beam")).json();
    $("beamOut").textContent = formatBeam(j);
  } catch (e) { $("beamOut").textContent = "request failed"; }
}
beamdetails.addEventListener("toggle", () => {
  if (beamdetails.open) { lastBeamSig = null; refreshBeam(); }
});

renderModeTabs();   // seed once now (SCENES is still empty); refreshScenes()
                    // above re-renders it with the real per-scene badge.
</script>
</body>
</html>
